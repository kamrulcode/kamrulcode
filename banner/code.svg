<svg width="1270" height="152" viewBox="0 0 1270 152" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glow filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Paths for motion -->
    <path id="pathL1" d="M 20,40 C 80,25 140,55 200,40 S 300,20 360,45" fill="none"/>
    <path id="pathL2" d="M 30,110 C 90,130 150,90 220,115 S 320,140 400,100" fill="none"/>
    <path id="pathC1" d="M 280,70 C 350,50 420,90 500,65 S 600,40 680,70" fill="none"/>
    <path id="pathC2" d="M 550,95 C 620,120 700,80 780,105 S 900,130 980,90" fill="none"/>
    <path id="pathR1" d="M 900,30 C 980,15 1060,50 1140,35 S 1220,20 1260,45" fill="none"/>
    <path id="pathR2" d="M 850,120 C 930,140 1010,100 1100,125 S 1200,145 1260,110" fill="none"/>
    <path id="pathExtra" d="M 100,80 C 180,60 260,100 340,75 S 450,50 520,85" fill="none"/>
  </defs>

  <!-- Background -->
  <rect width="1270" height="152" fill="#050510"/>

  <!-- Subtle grid dots -->
  <g opacity="0.25" fill="#6366f1">
    <circle cx="50" cy="20" r="1"/><circle cx="65" cy="20" r="1"/><circle cx="80" cy="20" r="1"/>
    <circle cx="50" cy="32" r="1"/><circle cx="65" cy="32" r="1"/><circle cx="80" cy="32" r="1"/>
    <circle cx="50" cy="44" r="1"/><circle cx="65" cy="44" r="1"/><circle cx="80" cy="44" r="1"/>
    <circle cx="180" cy="15" r="1"/><circle cx="195" cy="15" r="1"/><circle cx="210" cy="15" r="1"/>
    <circle cx="180" cy="27" r="1"/><circle cx="195" cy="27" r="1"/><circle cx="210" cy="27" r="1"/>
    <circle cx="580" cy="18" r="1"/><circle cx="595" cy="18" r="1"/><circle cx="610" cy="18" r="1"/><circle cx="625" cy="18" r="1"/>
    <circle cx="580" cy="30" r="1"/><circle cx="595" cy="30" r="1"/><circle cx="610" cy="30" r="1"/><circle cx="625" cy="30" r="1"/>
    <circle cx="1050" cy="25" r="1"/><circle cx="1065" cy="25" r="1"/><circle cx="1080" cy="25" r="1"/>
    <circle cx="1050" cy="37" r="1"/><circle cx="1065" cy="37" r="1"/><circle cx="1080" cy="37" r="1"/>
    <circle cx="1180" cy="100" r="1"/><circle cx="1195" cy="100" r="1"/><circle cx="1210" cy="100" r="1"/>
    <circle cx="1180" cy="112" r="1"/><circle cx="1195" cy="112" r="1"/><circle cx="1210" cy="112" r="1"/>
  </g>

  <!-- Dashed decorative paths -->
  <g stroke-dasharray="4 6" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M 20,40 C 80,25 140,55 200,40 S 300,20 360,45" stroke="#c084fc"/>
    <path d="M 30,110 C 90,130 150,90 220,115 S 320,140 400,100" stroke="#a78bfa"/>
    <path d="M 280,70 C 350,50 420,90 500,65 S 600,40 680,70" stroke="#818cf8"/>
    <path d="M 550,95 C 620,120 700,80 780,105 S 900,130 980,90" stroke="#60a5fa"/>
    <path d="M 900,30 C 980,15 1060,50 1140,35 S 1220,20 1260,45" stroke="#22d3ee"/>
    <path d="M 850,120 C 930,140 1010,100 1100,125 S 1200,145 1260,110" stroke="#38bdf8"/>
    <path d="M 100,80 C 180,60 260,100 340,75 S 450,50 520,85" stroke="#a78bfa" opacity="0.5"/>
  </g>

  <!-- Moving dots along the paths -->
  <circle r="3.5" fill="#e879f9" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#pathL1"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#c084fc" filter="url(#glow)">
    <animateMotion dur="7.5s" repeatCount="indefinite" rotate="auto" begin="0.5s">
      <mpath href="#pathL2"/>
    </animateMotion>
  </circle>
  <circle r="3.2" fill="#a5b4fc" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto" begin="1s">
      <mpath href="#pathC1"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#60a5fa" filter="url(#glow)">
    <animateMotion dur="6.5s" repeatCount="indefinite" rotate="auto" begin="0.3s">
      <mpath href="#pathC2"/>
    </animateMotion>
  </circle>
  <circle r="3.5" fill="#22d3ee" filter="url(#glow)">
    <animateMotion dur="5.5s" repeatCount="indefinite" rotate="auto" begin="1.2s">
      <mpath href="#pathR1"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#38bdf8" filter="url(#glow)">
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto" begin="0.8s">
      <mpath href="#pathR2"/>
    </animateMotion>
  </circle>
  <circle r="2.5" fill="#e879f9" filter="url(#softGlow)" opacity="0.9">
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto" begin="2s">
      <mpath href="#pathL1"/>
    </animateMotion>
  </circle>
  <circle r="2.8" fill="#22d3ee" filter="url(#softGlow)" opacity="0.85">
    <animateMotion dur="8.5s" repeatCount="indefinite" rotate="auto" begin="1.5s">
      <mpath href="#pathR2"/>
    </animateMotion>
  </circle>
  <circle r="2.5" fill="#a5b4fc" filter="url(#softGlow)">
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto" begin="3s">
      <mpath href="#pathExtra"/>
    </animateMotion>
  </circle>

  <!-- ========== CODE SNIPPETS (evenly distributed) ========== -->

  <!-- LEFT -->
  <g font-family="'Fira Code', 'Cascadia Code', 'Consolas', monospace" font-size="7.5" fill="#a5b4fc" opacity="0">
    <animate attributeName="opacity" from="0" to="0.9" dur="1.8s" begin="0.3s" fill="freeze"/>
    <text x="25" y="28">const developer = {</text>
    <text x="35" y="40">name: "Kamrul Islam",</text>
    <text x="35" y="52">passion: "Code",</text>
    <text x="35" y="64">goal: "Full-Stack"</text>
    <text x="25" y="76">};</text>
  </g>

  <!-- LEFT-CENTER -->
  <g font-family="'Fira Code', 'Cascadia Code', 'Consolas', monospace" font-size="7" fill="#c4b5fd" opacity="0">
    <animate attributeName="opacity" from="0" to="0.85" dur="1.8s" begin="0.5s" fill="freeze"/>
    <text x="280" y="105">function buildDream() {</text>
    <text x="292" y="117">learn();</text>
    <text x="292" y="129">code();</text>
    <text x="292" y="141">debug();</text>
  </g>

  <!-- CENTER -->
  <g font-family="'Fira Code', 'Cascadia Code', 'Consolas', monospace" font-size="7.5" fill="#a5b4fc" opacity="0">
    <animate attributeName="opacity" from="0" to="0.9" dur="1.8s" begin="0.4s" fill="freeze"/>
    <text x="520" y="30">import React from 'react';</text>
    <text x="520" y="43">const [dream, setDream] =</text>
    <text x="535" y="56">useState(true);</text>
  </g>

  <!-- CENTER-RIGHT -->
  <g font-family="'Fira Code', 'Cascadia Code', 'Consolas', monospace" font-size="7" fill="#7dd3fc" opacity="0">
    <animate attributeName="opacity" from="0" to="0.85" dur="1.8s" begin="0.6s" fill="freeze"/>
    <text x="780" y="100">function App() {</text>
    <text x="792" y="113">return &lt;Code /&gt;;</text>
    <text x="780" y="126">}</text>
  </g>

  <!-- RIGHT -->
  <g font-family="'Fira Code', 'Cascadia Code', 'Consolas', monospace" font-size="7" fill="#67e8f9" opacity="0">
    <animate attributeName="opacity" from="0" to="0.9" dur="1.8s" begin="0.7s" fill="freeze"/>
    <text x="1050" y="30">if (passion === true) {</text>
    <text x="1062" y="43">keepLearning();</text>
    <text x="1062" y="56">build();</text>
    <text x="1062" y="69">succeed();</text>
    <text x="1050" y="82">}</text>
  </g>

  <!-- ========== ICON BOXES (spread out) ========== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="0.9" dur="2s" begin="1s" fill="freeze"/>

    <!-- { } -->
    <rect x="210" y="20" width="26" height="20" rx="3" fill="none" stroke="#6366f1" stroke-width="1.1"/>
    <text x="216" y="35" font-family="monospace" font-size="11" fill="#a5b4fc">{ }</text>

    <!-- </> -->
    <rect x="450" y="110" width="30" height="20" rx="3" fill="none" stroke="#a78bfa" stroke-width="1.1"/>
    <text x="455" y="125" font-family="monospace" font-size="10" fill="#c084fc">&lt;/&gt;</text>

    <!-- </> -->
    <rect x="700" y="25" width="30" height="20" rx="3" fill="none" stroke="#22d3ee" stroke-width="1.1"/>
    <text x="705" y="40" font-family="monospace" font-size="10" fill="#67e8f9">&lt;/&gt;</text>

    <!-- >_ -->
    <rect x="980" y="115" width="26" height="20" rx="3" fill="none" stroke="#38bdf8" stroke-width="1.1"/>
    <text x="986" y="130" font-family="monospace" font-size="11" fill="#7dd3fc">&gt;_</text>
  </g>
</svg>
